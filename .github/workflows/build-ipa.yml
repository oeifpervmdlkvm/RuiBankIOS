name: Build RuiBanque IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Compile App and Generate Unsigned IPA
        run: |
          # 1. Prepare clean directories
          rm -rf build
          mkdir -p build/Payload/RuiBanque.app
          
          # 2. Get exact iOS SDK path
          SDK_PATH=$(xcrun --show-sdk-path --sdk iphoneos)
          echo "Using SDK: $SDK_PATH"
          
          # 3. Compile SwiftUI sources targeting real iOS devices (arm64)
          xcrun -sdk iphoneos swiftc \
            -target arm64-apple-ios16.0 \
            -sdk "$SDK_PATH" \
            -parse-as-library \
            -framework UIKit \
            -framework WebKit \
            -framework SwiftUI \
            -emit-executable \
            -o build/Payload/RuiBanque.app/RuiBanque \
            RuiBanqueApp.swift ContentView.swift
            
          # 4. Copy Info.plist into the app bundle
          cp Info.plist build/Payload/RuiBanque.app/
          
          # 5. Package into IPA archive
          cd build
          zip -r -y RuiBanque.ipa Payload/
          echo "Build successful! Created RuiBanque.ipa"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RuiBanque-iOS-App
          path: build/RuiBanque.ipa
